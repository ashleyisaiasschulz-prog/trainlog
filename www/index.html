<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grapplr</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #09090b; color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
      }
      .wrap { max-width: 320px; }
      h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
      h1 span { color: #ef4444; }
      p { font-size: 14px; color: #a1a1aa; line-height: 1.5; }
      button {
        margin-top: 20px; background: #dc2626; color: #fff; border: 0;
        font-weight: 600; font-size: 15px; padding: 12px 24px;
        border-radius: 12px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Grapplr<span>.</span></h1>
      <p>You're offline. Connect to the internet to load your training log.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
